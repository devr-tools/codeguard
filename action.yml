name: Devr Codeguard
description: Run Devr CodeGuard repository policy checks for AI generated and human code
branding:
  icon: shield
  color: gray-dark


inputs:
  config:
    description: Path to the Devr CodeGuard config file
    required: false
    default: codeguard.yaml
  profile:
    description: Optional policy profile override
    required: false
    default: ""
  mode:
    description: Scan mode
    required: false
    default: full
  base-ref:
    description: Base ref to diff against when mode is diff
    required: false
    default: main
  format:
    description: Output format
    required: false
    default: github
  fail-on:
    description: >-
      Optional exit policy passed to codeguard scan -fail-on. fail exits non-zero when a
      section fails, warn also when a section warns, none only on operational failures.
      Empty (the default) uses output.fail_on from the config, or fail.
    required: false
    default: ""
  comment-fix-mode:
    description: PR comment mode. Use sticky to create or update a fix-oriented PR comment.
    required: false
    default: "off"
  comment-tag:
    description: Sticky marker used to update an existing CodeGuard PR comment.
    required: false
    default: codeguard-action-comment
  version:
    description: Optional Devr CodeGuard version override. By default, builds the version bundled with this action.
    required: false
    default: ""
  upload-sarif:
    description: >-
      Set to true to also write the scan as SARIF and upload it to GitHub code scanning, so
      findings appear in the Security tab. The calling job needs permissions security-events: write.
    required: false
    default: "false"
  sarif-category:
    description: Code scanning category for the SARIF upload; use distinct values when one workflow uploads several codeguard runs.
    required: false
    default: codeguard
  sarif-file:
    description: Path for the SARIF file when upload-sarif is true. Empty (the default) writes it under $RUNNER_TEMP.
    required: false
    default: ""
  review-comments:
    description: >-
      Inline PR review comments. Use on to post findings on changed lines as one
      pull request review (event COMMENT, never approve or request changes).
      Requires pull-requests write permission.
    required: false
    default: "off"
  review-comment-limit:
    description: Maximum inline review comments per run when review-comments is on. Further findings are listed in the review body.
    required: false
    default: "25"

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: "1.23"

    - name: Install Devr CodeGuard
      shell: bash
      env:
        CODEGUARD_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$CODEGUARD_VERSION" ]; then
          go install "github.com/devr-tools/codeguard/cmd/codeguard@$CODEGUARD_VERSION"
        else
          cd "$GITHUB_ACTION_PATH"
          go install ./cmd/codeguard
        fi

    - name: Run Devr CodeGuard
      id: scan
      shell: bash
      env:
        CODEGUARD_CONFIG: ${{ inputs.config }}
        CODEGUARD_PROFILE: ${{ inputs.profile }}
        CODEGUARD_MODE: ${{ inputs.mode }}
        CODEGUARD_BASE_REF: ${{ inputs.base-ref }}
        CODEGUARD_FORMAT: ${{ inputs.format }}
        CODEGUARD_FAIL_ON: ${{ inputs.fail-on }}
        CODEGUARD_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        CODEGUARD_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set +e
        scan_args=(scan -config "$CODEGUARD_CONFIG" -mode "$CODEGUARD_MODE" -base-ref "$CODEGUARD_BASE_REF" -format "$CODEGUARD_FORMAT")
        if [ -n "$CODEGUARD_PROFILE" ]; then
          scan_args+=(-profile "$CODEGUARD_PROFILE")
        fi
        if [ -n "$CODEGUARD_FAIL_ON" ]; then
          scan_args+=(-fail-on "$CODEGUARD_FAIL_ON")
        fi
        sarif_file=""
        if [ "$(printf '%s' "$CODEGUARD_UPLOAD_SARIF" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          sarif_file="${CODEGUARD_SARIF_FILE:-$RUNNER_TEMP/codeguard.sarif}"
          rm -f "$sarif_file"
          scan_args+=(-sarif-output "$sarif_file")
        fi
        codeguard "${scan_args[@]}"
        status=$?
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        # The SARIF file is written even when findings fail the scan; it is
        # missing only when the scan itself broke, which exit_code reports.
        if [ -n "$sarif_file" ] && [ -s "$sarif_file" ]; then
          echo "sarif_file=$sarif_file" >> "$GITHUB_OUTPUT"
        elif [ -n "$sarif_file" ]; then
          echo "::warning title=CodeGuard SARIF::codeguard scan did not write $sarif_file (exit $status); nothing will be uploaded to code scanning."
        fi
        exit 0

    - name: Upload Devr CodeGuard SARIF
      if: ${{ !cancelled() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif_file != '' }}
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_file }}
        category: ${{ inputs.sarif-category }}

    - name: Post Devr CodeGuard fix comment
      if: ${{ inputs.comment-fix-mode != 'off' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CODEGUARD_CONFIG: ${{ inputs.config }}
        CODEGUARD_PROFILE: ${{ inputs.profile }}
        CODEGUARD_MODE: ${{ inputs.mode }}
        CODEGUARD_BASE_REF: ${{ inputs.base-ref }}
        CODEGUARD_COMMENT_TAG: ${{ inputs.comment-tag }}
        CODEGUARD_COMMENT_MODE: ${{ inputs.comment-fix-mode }}
        CODEGUARD_REPOSITORY: ${{ github.repository }}
      # Runs in the default working directory ($GITHUB_WORKSPACE) so the scan
      # covers the caller's repository; only the comment helper is built from
      # the action's own source.
      run: |
        report_file="$(mktemp)"
        scan_args=(scan -config "$CODEGUARD_CONFIG" -mode "$CODEGUARD_MODE" -base-ref "$CODEGUARD_BASE_REF" -format github-comment)
        if [ -n "$CODEGUARD_PROFILE" ]; then
          scan_args+=(-profile "$CODEGUARD_PROFILE")
        fi
        # A scan with failing sections also exits 1, so the exit status alone
        # cannot tell findings from a broken run; an empty report can.
        set +e
        codeguard "${scan_args[@]}" > "$report_file"
        scan_status=$?
        set -e
        if [ ! -s "$report_file" ]; then
          msg="codeguard scan -format github-comment produced no report (exit $scan_status); the PR comment was not posted. See the scan error above."
          echo "::error title=CodeGuard PR comment::$msg"
          echo "$msg" >&2
          exit 1
        fi
        go -C "$GITHUB_ACTION_PATH" run ./cmd/codeguard-action-comment \
          -body-file "$report_file" \
          -repository "$CODEGUARD_REPOSITORY" \
          -marker "$CODEGUARD_COMMENT_TAG" \
          -mode "$CODEGUARD_COMMENT_MODE"

    - name: Post Devr CodeGuard review comments
      if: ${{ inputs.review-comments == 'on' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CODEGUARD_CONFIG: ${{ inputs.config }}
        CODEGUARD_PROFILE: ${{ inputs.profile }}
        CODEGUARD_MODE: ${{ inputs.mode }}
        CODEGUARD_BASE_REF: ${{ inputs.base-ref }}
        CODEGUARD_REVIEW_COMMENT_LIMIT: ${{ inputs.review-comment-limit }}
        CODEGUARD_REPOSITORY: ${{ github.repository }}
      # Scans the caller's checkout from the default working directory, like
      # the comment step; only the review helper is built from the action.
      run: |
        report_file="$(mktemp)"
        scan_args=(scan -config "$CODEGUARD_CONFIG" -mode "$CODEGUARD_MODE" -base-ref "$CODEGUARD_BASE_REF" -format json)
        if [ -n "$CODEGUARD_PROFILE" ]; then
          scan_args+=(-profile "$CODEGUARD_PROFILE")
        fi
        set +e
        codeguard "${scan_args[@]}" > "$report_file"
        scan_status=$?
        set -e
        if [ ! -s "$report_file" ]; then
          msg="codeguard scan -format json produced no report (exit $scan_status); the PR review comments were not posted. See the scan error above."
          echo "::error title=CodeGuard PR review::$msg"
          echo "$msg" >&2
          exit 1
        fi
        go -C "$GITHUB_ACTION_PATH" run ./cmd/codeguard-action-review \
          -report-file "$report_file" \
          -repository "$CODEGUARD_REPOSITORY" \
          -limit "$CODEGUARD_REVIEW_COMMENT_LIMIT"

    - name: Fail workflow on Devr CodeGuard findings
      if: ${{ steps.scan.outputs.exit_code != '0' }}
      shell: bash
      env:
        CODEGUARD_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: exit "$CODEGUARD_EXIT_CODE"
