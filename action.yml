name: Devr Codeguard
description: Run Devr CodeGuard repository policy checks for AI generated and human code
branding:
  icon: shield
  color: gray-dark


inputs:
  config:
    description: Path to the Devr CodeGuard config file
    required: false
    default: codeguard.yaml
  profile:
    description: Optional policy profile override
    required: false
    default: ""
  mode:
    description: Scan mode
    required: false
    default: full
  base-ref:
    description: Base ref to diff against when mode is diff
    required: false
    default: main
  format:
    description: Output format
    required: false
    default: github
  comment-fix-mode:
    description: PR comment mode. Use sticky to create or update a fix-oriented PR comment.
    required: false
    default: "off"
  comment-tag:
    description: Sticky marker used to update an existing CodeGuard PR comment.
    required: false
    default: codeguard-action-comment
  version:
    description: Devr CodeGuard version to install
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.23"

    - name: Install Devr CodeGuard
      shell: bash
      run: go install github.com/devr-tools/codeguard/cmd/codeguard@${{ inputs.version }}

    - name: Run Devr CodeGuard
      id: scan
      shell: bash
      run: |
        set +e
        if [ -n "${{ inputs.profile }}" ]; then
          codeguard scan \
            -config "${{ inputs.config }}" \
            -mode "${{ inputs.mode }}" \
            -base-ref "${{ inputs.base-ref }}" \
            -format "${{ inputs.format }}" \
            -profile "${{ inputs.profile }}"
          status=$?
        else
          codeguard scan \
            -config "${{ inputs.config }}" \
            -mode "${{ inputs.mode }}" \
            -base-ref "${{ inputs.base-ref }}" \
            -format "${{ inputs.format }}"
          status=$?
        fi
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Post Devr CodeGuard fix comment
      if: ${{ inputs.comment-fix-mode != 'off' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CODEGUARD_CONFIG: ${{ inputs.config }}
        CODEGUARD_PROFILE: ${{ inputs.profile }}
        CODEGUARD_MODE: ${{ inputs.mode }}
        CODEGUARD_BASE_REF: ${{ inputs.base-ref }}
        CODEGUARD_COMMENT_TAG: ${{ inputs.comment-tag }}
        CODEGUARD_COMMENT_MODE: ${{ inputs.comment-fix-mode }}
        CODEGUARD_REPOSITORY: ${{ github.repository }}
      # Runs in the default working directory ($GITHUB_WORKSPACE) so the scan
      # covers the caller's repository; only the comment helper is built from
      # the action's own source.
      run: |
        report_file="$(mktemp)"
        scan_args=(scan -config "$CODEGUARD_CONFIG" -mode "$CODEGUARD_MODE" -base-ref "$CODEGUARD_BASE_REF" -format github-comment)
        if [ -n "$CODEGUARD_PROFILE" ]; then
          scan_args+=(-profile "$CODEGUARD_PROFILE")
        fi
        # A scan with failing sections also exits 1, so the exit status alone
        # cannot tell findings from a broken run; an empty report can.
        set +e
        codeguard "${scan_args[@]}" > "$report_file"
        scan_status=$?
        set -e
        if [ ! -s "$report_file" ]; then
          msg="codeguard scan -format github-comment produced no report (exit $scan_status); the PR comment was not posted. See the scan error above."
          echo "::error title=CodeGuard PR comment::$msg"
          echo "$msg" >&2
          exit 1
        fi
        go -C "$GITHUB_ACTION_PATH" run ./cmd/codeguard-action-comment \
          -body-file "$report_file" \
          -repository "$CODEGUARD_REPOSITORY" \
          -marker "$CODEGUARD_COMMENT_TAG" \
          -mode "$CODEGUARD_COMMENT_MODE"

    - name: Fail workflow on Devr CodeGuard findings
      if: ${{ steps.scan.outputs.exit_code != '0' }}
      shell: bash
      run: exit "${{ steps.scan.outputs.exit_code }}"
